services:
  app:
    build:
      context: ../../docker-templates/php
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www
    command: >
      sh -c "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache &&
             php-fpm"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hospital-network
  nginx:
    image: nginx:alpine
    ports:
      - "8600:80"
    volumes:
      - ./:/var/www
      - ../../docker-templates/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hospital-network

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hospital_db
      MYSQL_USER: hospital_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - hospital-db-data:/var/lib/mysql
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
      - "9002:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 40M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hospital-network
volumes:
  hospital-db-data:

networks:
  hospital-network:
    driver: bridge